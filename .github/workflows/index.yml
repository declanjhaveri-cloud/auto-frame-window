name: Build Geode Index Version

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          # Windows
          - name: Windows
            os: windows-latest
            extra-cmake-args: "-DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl -DAFW_SELF_UPDATE=OFF"

          # Android
          - name: Android32
            os: ubuntu-latest
            target: Android32
            extra-cmake-args: "-DAFW_SELF_UPDATE=OFF"

          - name: Android64
            os: ubuntu-latest
            target: Android64
            extra-cmake-args: "-DAFW_SELF_UPDATE=OFF"

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Latest CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: 'latest'

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}
          extra-cmake-args: ${{ matrix.config.extra-cmake-args }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: auto_frame_window_index
          path: ${{ steps.build.outputs.build-output }}
  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: ['package']
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: auto_frame_window_index
          path: out

      - name: Read version
        id: ver
        run: |
          echo "ver=$(jq -r .version mod.json)" >> "$GITHUB_OUTPUT"
          echo "tag=$(jq -r .version mod.json)-index" >> "$GITHUB_OUTPUT"

      - name: Release notes from changelog
        run: |
          TAG="${{ steps.ver.outputs.ver }}"
          awk -v h="## $TAG" '/^## /{if(f)exit} $0==h{f=1;next} f' changelog.md > notes.md
          cat notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Auto Frame Window ${{ steps.ver.outputs.ver }} (Geode index build)
          make_latest: false
          prerelease: true
          files: out/*.geode
          body_path: notes.md
